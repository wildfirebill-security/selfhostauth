name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            script: package:win
            artifact: selfhostauth-windows
          - os: macos-latest
            target: mac
            script: package:mac
            artifact: selfhostauth-macos
          - os: ubuntu-latest
            target: linux
            script: package:linux
            artifact: selfhostauth-linux
    runs-on: ${{ matrix.os }}
    env:
      # Skip code signing when no certs are configured
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @selfhostauth/desktop build

      - name: Package (${{ matrix.target }})
        run: pnpm --filter @selfhostauth/desktop ${{ matrix.script }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/dist/installers/**
          if-no-files-found: error