name: Mobile (local build)

# Self-contained alternative to EAS: builds the Expo app on GitHub-hosted
# runners using Expo prebuild (CNG). No external services needed, but the
# native toolchains run here:
#   - Android: unsigned release APK (signed with the debug keystore)
#   - iOS:     unsigned simulator build (code signing disabled — a real
#              .ipa requires Apple certs; add them to the runner or use EAS)
#
# Trigger with "Run workflow" or on tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android APK (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native project (prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selfhostauth-android
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS app (macOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate native project + pods (prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --non-interactive

      - name: Build (simulator, no code signing)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace selfhostauth.xcworkspace \
            -scheme selfhostauth \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: selfhostauth-ios-simulator
          path: apps/mobile/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error