name: Mobile (local build)

# 100% OSS bare React Native — no Expo, no EAS. Builds directly
# with the Android Gradle Plugin and Xcode. Native projects
# (android/ ios/) are generated from the open-source React Native
# template (npx @react-native-community/cli) if not already committed.

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @selfhostauth/core --filter @selfhostauth/client build

      - name: Generate native projects if missing (OSS)
        working-directory: apps/mobile
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            echo "Native projects missing — bootstrapping bare React Native 0.76 template (OSS)..."
            npx --yes @react-native-community/cli@13 init Selfhostauth --version 0.76 --directory /tmp/rn-template --skip-install --npm
            [ -d android ] || cp -r /tmp/rn-template/android ./android
            [ -d ios ] || cp -r /tmp/rn-template/ios ./ios
            # Wire workspace package name
            sed -i 's/"name": "Selfhostauth"/"name": "@selfhostauth\/mobile"/' package.json 2>/dev/null || true
          fi
          ls -d android ios

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selfhostauth-android
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS app (macOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @selfhostauth/core --filter @selfhostauth/client build

      - name: Generate native projects if missing (OSS)
        working-directory: apps/mobile
        run: |
          if [ ! -d ios ] || [ ! -d android ]; then
            echo "Native projects missing — bootstrapping bare React Native 0.76 template (OSS)..."
            npx --yes @react-native-community/cli@13 init Selfhostauth --version 0.76 --directory /tmp/rn-template --skip-install --npm
            [ -d ios ] || cp -r /tmp/rn-template/ios ./ios
            [ -d android ] || cp -r /tmp/rn-template/android ./android
          fi
          ls -d android ios

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build (simulator, no code signing)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Selfhostauth.xcworkspace \
            -scheme Selfhostauth \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: selfhostauth-ios-simulator
          path: apps/mobile/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
