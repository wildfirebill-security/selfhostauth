name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @selfhostauth/core --filter @selfhostauth/client build && pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoke test server (live boot)
        run: |
          pnpm --filter @selfhostauth/server start > /tmp/sha-server.log 2>&1 &
          PID=$!
          sleep 4
          curl -fsS http://127.0.0.1:8787/api/v1/info
          kill "$PID" || true
        shell: bash

      - name: Upload extension artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: selfhostauth-extension
          path: apps/extension/dist
          if-no-files-found: error