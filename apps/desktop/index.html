<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:* https:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>selfhostauth</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">◈</span>
          <span>selfhostauth</span>
        </div>
        <div class="topbar-actions">
          <button id="btn-sync" class="ghost" title="Sync with server">⟳</button>
          <button id="btn-settings" class="ghost" title="Settings">⚙</button>
        </div>
      </header>

      <main>
        <!-- Login / setup view -->
        <section id="view-login" class="view hidden">
          <h1>Connect to your server</h1>
          <form id="login-form">
            <label>
              Server URL
              <input id="input-server" type="url" placeholder="https://auth.example.com" required />
            </label>
            <label>
              Username
              <input id="input-username" type="text" autocomplete="username" required />
            </label>
            <label>
              Password
              <input id="input-password" type="password" autocomplete="current-password" required />
            </label>
            <label class="row">
              <input id="input-register" type="checkbox" />
              <span>Create a new account</span>
            </label>
            <p id="login-error" class="error hidden"></p>
            <button type="submit" class="primary">Connect</button>
          </form>
        </section>

        <!-- Vault view -->
        <section id="view-vault" class="view hidden">
          <div class="vault-head">
            <input id="input-search" type="search" placeholder="Search vault…" />
            <button id="btn-add" class="primary" title="Add authenticator">＋ Add</button>
          </div>
          <div id="vault-list" class="vault-list"></div>
          <p id="sync-status" class="sync-status"></p>
        </section>

        <!-- Settings view -->
        <section id="view-settings" class="view hidden">
          <h1>Settings</h1>
          <label>
            Server URL
            <input id="set-server" type="url" />
          </label>
          <p class="muted">Signed in as <span id="set-username"></span></p>
          <div class="row">
            <button id="btn-save-server" class="primary">Save</button>
            <button id="btn-signout" class="danger">Sign out</button>
          </div>
          <p id="settings-error" class="error hidden"></p>
        </section>

        <!-- Add/edit item modal -->
        <div id="modal" class="modal hidden">
          <div class="modal-card">
            <h2 id="modal-title">Add authenticator</h2>
            <form id="item-form">
              <label>
                Import URI or secret
                <input id="item-secret" type="text" placeholder="otpauth://totp/… or base32 secret" />
              </label>
              <label>
                Name
                <input id="item-name" type="text" placeholder="GitHub" />
              </label>
              <label>
                Issuer <span class="muted">(optional)</span>
                <input id="item-issuer" type="text" placeholder="GitHub" />
              </label>
              <label>
                Account <span class="muted">(optional)</span>
                <input id="item-account" type="text" placeholder="you@example.com" />
              </label>
              <p id="item-error" class="error hidden"></p>
              <div class="row">
                <button type="button" id="btn-item-cancel" class="ghost">Cancel</button>
                <button type="submit" class="primary">Save</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/renderer/index.ts"></script>
  </body>
</html>
